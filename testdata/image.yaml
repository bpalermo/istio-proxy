schemaVersion: '2.0.0'
metadataTest:
  entrypoint: ["/usr/local/bin/pilot-agent"]
  workdir: "/"
  user: 65532
  envVars:
    - key: ENVOY_DYNAMIC_MODULES_SEARCH_PATH
      value: /usr/local/lib
    - key: ISTIO_META_ISTIO_PROXY_SHA
      value: 19d31b12e62848c5e9f3f786c6c9a650ebc00b64
fileExistenceTests:
  - name: 'envoy'
    path: '/usr/local/bin/envoy'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0
  - name: 'pilot_agent'
    path: '/usr/local/bin/pilot-agent'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0
  - name: 'envoy_bootstrap'
    path: '/var/lib/istio/envoy/envoy_bootstrap_tmpl.json'
    shouldExist: true
    permissions: '-rw-r--r--'
    uid: 0
    gid: 0
