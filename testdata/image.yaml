schemaVersion: '2.0.0'
metadataTest:
  entrypoint: ["/usr/local/bin/pilot-agent"]
  workdir: "/"
  user: 65532
  envVars:
    # ISTIO_PROXY_SHA of //bazel:versions.bzl
    - key: ISTIO_META_ISTIO_PROXY_SHA
      value: 4c11f0bd59e6ac516ff84495e30b019e8f913c92
fileExistenceTests:
  - name: 'envoy'
    path: '/usr/local/bin/envoy'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0
  - name: 'pilot_agent'
    path: '/usr/local/bin/pilot-agent'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0
  - name: 'envoy_bootstrap'
    path: '/var/lib/istio/envoy/envoy_bootstrap_tmpl.json'
    shouldExist: true
    permissions: '-rw-r--r--'
    uid: 0
    gid: 0
