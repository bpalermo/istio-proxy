name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to the pull request cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@36765610732de8ee2e81a5c6c231506e2b5cabcf # v5.1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Restore the caches main saved, but do not save new ones.
          cache-save: false
      # Builds envoy and pilot-agent for linux/amd64 and linux/arm64 with the
      # toolchains Bazel downloads, and checks the image. No compiler, Go or
      # Docker is taken from the runner.
      - name: Test
        run: |
          bazel test --config=ci --config=ci-pr --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //...
