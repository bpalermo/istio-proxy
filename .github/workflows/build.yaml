name: Build

on:
  push:
    branches:
      - main

env:
  REGISTRY_IMAGE: palermo/istio-proxy
  CARGO_BAZEL_REPIN: true

jobs:
  istio:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: istio/istio
          ref: 0879e0055d1da524a89415acd456e230b27fba70
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Istio
        env:
          BUILD_WITH_CONTAINER: '0'
        run: |
          make build-linux
      - name: Set architecture
        run: |
          if [ "${{ runner.arch }}" = "X64" ]; then
            echo "ARCH=amd64" >> $GITHUB_ENV
          elif [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "ARCH=arm64" >> $GITHUB_ENV
          fi
      - name: Prepare and upload istio files
        run: |
          mkdir -p istio-files
          cp out/linux_${{ env.ARCH }}/pilot-agent istio-files/
          cp tools/packaging/common/envoy_bootstrap.json istio-files/
      - name: Upload istio files
        uses: actions/upload-artifact@v4
        with:
          name: istio-${{ env.ARCH }}
          path: istio-files/*
          if-no-files-found: error
          retention-days: 1
  build:
    runs-on: ${{ matrix.os }}
    needs: [ istio ]
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      - name: APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtinfo5
          sudo rm -rf /var/lib/apt/lists/*
      - name: Set architecture
        run: |
          if [ "${{ runner.arch }}" = "X64" ]; then
            echo "ARCH=amd64" >> $GITHUB_ENV
          elif [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "ARCH=arm64" >> $GITHUB_ENV
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          name: istio-${{ env.ARCH }}
          path: ./
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1"
          directory: ${{ runner.temp }}/llvm
      - name: Setup Build
        run: |
          bazel/setup_clang.sh "${{ env.LLVM_PATH }}"
          echo "build --config=clang" >> user.bazelrc
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build ${{ runner.arch }}
        run: |
          bazel build --config=ci --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //...
      - name: Push ${{ runner.arch }}
        run: |
          bazel run --config=ci --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //:push -- --repository ${{ env.REGISTRY_IMAGE }} --tag ${{ github.sha }}-${{ matrix.arch }}

  merge:
    runs-on: ubuntu-22.04
    needs:
      - build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create manifest and push
        run: |
          docker buildx imagetools create --tag ${{ env.REGISTRY_IMAGE }}:${{ github.sha }} \
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-arm64 ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-amd64
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
